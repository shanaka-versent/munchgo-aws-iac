# Kong Konnect Grafana Dashboard
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Grafana's sidecar auto-discovers ConfigMaps with label grafana_dashboard=1
# across all namespaces (searchNamespace: ALL in kube-prometheus-stack values).
# This ConfigMap is picked up automatically — no manual import needed.
#
# Dashboard panels:
#   - Request rate (req/min) by service
#   - Error rate (4xx + 5xx %) by service
#   - P99 end-to-end latency by service
#   - P99 upstream latency by service
#   - Request count total (stat panel)
#   - 5xx error count (stat panel with alert threshold)

apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-konnect-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  kong-konnect.json: |
    {
      "annotations": { "list": [] },
      "description": "Kong Konnect Cloud Gateway — request metrics via Konnect Analytics API",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "reqpm"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "calcs": ["last", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum by (service) (kong_konnect_requests_total)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "Request Rate by Service (req/min)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "expr": "sum by (service) (kong_konnect_4xx_total + kong_konnect_5xx_total) / sum by (service) (kong_konnect_requests_total + 0.001)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "Error Rate by Service (4xx + 5xx %)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 2000 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "expr": "sum by (service) (kong_konnect_request_latency_ms_p99)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "P99 End-to-End Latency by Service (ms)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            {
              "expr": "sum by (service) (kong_konnect_upstream_latency_ms_p99)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "P99 Upstream Latency by Service (ms)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "blue", "mode": "fixed" },
              "unit": "short",
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 16 },
          "id": 5,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(kong_konnect_requests_total)",
              "legendFormat": "Total",
              "refId": "A"
            }
          ],
          "title": "Total Requests (last minute)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 16 },
          "id": 6,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(kong_konnect_5xx_total)",
              "legendFormat": "5xx",
              "refId": "A"
            }
          ],
          "title": "5xx Errors (last minute)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "orange", "value": 20 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 16 },
          "id": 7,
          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "sum(kong_konnect_4xx_total)",
              "legendFormat": "4xx",
              "refId": "A"
            }
          ],
          "title": "4xx Client Errors (last minute)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 2000 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 16 },
          "id": 8,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto" },
          "targets": [
            {
              "expr": "max(kong_konnect_request_latency_ms_p99)",
              "legendFormat": "P99",
              "refId": "A"
            }
          ],
          "title": "Worst P99 Latency (ms)",
          "type": "stat"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 38,
      "tags": ["kong", "konnect", "gateway"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Kong Konnect — Gateway Metrics",
      "uid": "kong-konnect-metrics",
      "version": 1
    }
