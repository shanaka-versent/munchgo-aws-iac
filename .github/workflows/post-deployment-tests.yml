# Post-Deployment API Integration Tests — MunchGo Platform
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Runs the full MunchGo order lifecycle API test suite (13 requests) against
# the live CloudFront → Kong → Istio → Microservices stack after every deployment.
#
# Triggers:
#   1. Push to main changing deck/kong.yaml
#      → Syncs Kong Gateway config (deck gateway sync) THEN waits for health THEN tests
#
#   2. repository_dispatch with event_type: microservice-deployed
#      → Triggered automatically by the munchgo-microservices CI pipeline
#        after the GitOps repo is updated (ArgoCD syncs within ~3 min).
#        The api-tests job polls /healthz until the platform is ready.
#
#   3. workflow_dispatch (manual)
#      → Run tests on demand at any time, with optional URL override
#
# Secrets required (Settings → Secrets and variables → Actions):
#   KONNECT_TOKEN   — Kong Konnect Personal Access Token (deck sync only)
#
# The base_url in the Insomnia collection is kept current automatically by
# scripts/03-post-terraform-setup.sh on every new environment provision.

name: Post-Deployment API Tests

on:
  # Trigger 1: Kong Gateway config changes pushed to main
  push:
    branches: [main]
    paths:
      - 'deck/kong.yaml'

  # Trigger 2: Called from munchgo-microservices CI after GitOps repo update
  repository_dispatch:
    types: [microservice-deployed]

  # Trigger 3: Manual — run tests at any time with optional URL override
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override base URL (leave empty to use value in collection)'
        required: false
        default: ''

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Sync Kong Gateway config (only runs when deck/kong.yaml is pushed)
  # ---------------------------------------------------------------------------
  kong-sync:
    name: Sync Kong Gateway Config
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install decK CLI
        run: |
          curl -sL https://github.com/Kong/deck/releases/download/v1.40.3/deck_1.40.3_linux_amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/deck /usr/local/bin/deck
          deck version

      - name: Sync Kong Gateway config to Konnect
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          KONNECT_REGION: ${{ vars.KONNECT_REGION || 'au' }}
        run: |
          # Skip sync if kong.yaml still has deployment placeholders (pre-setup state).
          # Placeholders are replaced by 03-post-terraform-setup.sh during deployment.
          if grep -q 'PLACEHOLDER_NLB_DNS\|PLACEHOLDER_COGNITO_ISSUER_URL' deck/kong.yaml; then
            echo "::warning::kong.yaml contains deployment placeholders — skipping sync (run 03-post-terraform-setup.sh first)"
            exit 0
          fi

          # Sync our config. Konnect-managed SNIs (tagged konnect-managed) may
          # cause immutable-entity delete errors — these are safe to ignore
          # because we don't manage SNIs; Konnect auto-creates them for the
          # cloud gateway data plane.
          OUTPUT=$(deck gateway sync deck/kong.yaml \
            --konnect-addr "https://${KONNECT_REGION}.api.konghq.com" \
            --konnect-token "$KONNECT_TOKEN" \
            --konnect-control-plane-name MunchGo 2>&1) || {
            # Check if the only "processing event" failures are konnect-managed SNIs
            NON_SNI_ERRORS=$(echo "$OUTPUT" | grep "while processing event" | grep -v "konnect-managed.*immutable" || true)
            if [ -z "$NON_SNI_ERRORS" ] && echo "$OUTPUT" | grep -q "konnect-managed.*immutable"; then
              echo "::warning::decK reported konnect-managed SNI delete errors (safe to ignore)"
              echo "$OUTPUT"
            else
              echo "$OUTPUT"
              exit 1
            fi
          }

  # ---------------------------------------------------------------------------
  # Job 2: Run API integration tests (always runs, after kong-sync if applicable)
  # ---------------------------------------------------------------------------
  api-tests:
    name: MunchGo API Integration Tests
    runs-on: ubuntu-latest
    needs: [kong-sync]
    # Run even when kong-sync was skipped (non-push triggers) or succeeded
    if: |
      always() &&
      (needs.kong-sync.result == 'success' || needs.kong-sync.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve base URL
        run: |
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            BASE_URL="${{ github.event.inputs.base_url }}"
          else
            BASE_URL=$(jq -r '.resources[] | select(._type == "environment") | .data.base_url' insomnia/munchgo-api.json)
          fi
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Testing against: $BASE_URL"
          echo "Trigger: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Deployed service: ${{ github.event.client_payload.service }}"
            echo "Image SHA: ${{ github.event.client_payload.sha }}"
          fi

      # Poll /healthz until the platform is ready (or timeout after 5 min).
      # Covers: ArgoCD sync delay (~3 min) + pod rolling update (~1-2 min).
      # Skipped for manual dispatch where platform is assumed already running.
      - name: Wait for platform to be healthy
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Polling $BASE_URL/healthz (up to 5 min)..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL/healthz" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Platform healthy after attempt $i ($((i * 15))s)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "✗ Platform not healthy after 5 min (last HTTP status: $STATUS)"
              exit 1
            fi
            echo "  Attempt $i: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done

      - name: Run API smoke tests
        run: |
          PASS=0
          FAIL=0
          TOTAL=0

          check() {
            local name="$1" method="$2" path="$3" expected="$4"
            TOTAL=$((TOTAL + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" --max-time 15 "$BASE_URL$path" 2>/dev/null || echo "000")
            if [ "$STATUS" = "$expected" ]; then
              echo "  ✓ $name — HTTP $STATUS"
              PASS=$((PASS + 1))
            else
              echo "  ✗ $name — expected $expected, got $STATUS"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== MunchGo API Smoke Tests ==="
          echo ""

          echo "--- Health & Routing ---"
          check "Health check" GET "/healthz" "200"
          check "Auth endpoint reachable" POST "/api/v1/auth/login" "400"
          check "Restaurants (public, anonymous)" GET "/api/v1/restaurants" "200"
          check "Consumers (requires auth)" GET "/api/v1/consumers" "401"
          check "Orders (requires auth)" GET "/api/v1/orders" "401"
          check "Couriers (requires auth)" GET "/api/v1/couriers" "401"
          check "Sagas (requires auth)" GET "/api/v1/sagas/test" "401"

          echo ""
          echo "=== Results: $PASS/$TOTAL passed, $FAIL failed ==="

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
